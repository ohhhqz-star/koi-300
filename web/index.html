<!doctype html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复盘 300 · 本地投资复盘</title>
  <meta name="description" content="在买入前，先写 300 次。一个只在本机保存数据的极简投资复盘工具，支持 Mac 与 Windows。">
  <meta name="theme-color" content="#F6F2EA">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 8h13"/><circle cx="16.5" cy="13.5" r="1.2"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v18H7.5A2.5 2.5 0 0 1 5 18.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H19"/><path d="M9 7h6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17.5h2"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4.5 15v3A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5v-3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5"/><path d="M4.5 15v3A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5v-3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14.5 5.5 4 4L8 20H4v-4z"/><path d="m12.5 7.5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M7 7l.8 13h8.4L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m0 0-5-5m5 5-5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3.5 2.5L20 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="72 72 368 320" fill="#f6f1e7" aria-hidden="true">
            <path d="M415 225C402 190 370 172 332 170 280 168 232 188 198 222 186 234 178 244 172 252 144 226 114 206 84 190 104 218 120 248 132 272 116 310 104 334 80 354 116 330 142 318 172 302 210 340 258 356 306 348 352 340 392 304 415 258 420 244 420 234 415 225Z"/>
            <path d="M304 180C312 148 332 130 356 136 348 154 338 168 330 180Z"/>
            <path d="M322 320C318 344 300 366 274 378 282 352 296 332 322 320Z"/>
            <circle cx="378" cy="210" r="8" style="fill: var(--accent-solid)"/>
            <circle cx="381" cy="207" r="2.6"/>
            <circle cx="424" cy="104" r="24" fill="#B06A4F"/>
          </svg>
        </div>
        <div class="brand-copy">
          <strong>复盘 300</strong>
          <span>每天 3 分钟</span>
        </div>
        <button class="brand-theme" data-action="cycle-theme" aria-label="切换纸色" title="切换纸色">
          <span class="brand-theme-dot" aria-hidden="true"></span>
          <span data-theme-name>暖米</span>
        </button>
      </div>

      <p class="nav-label">记录</p>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item" data-section="overview"><svg class="icon"><use href="#i-grid"/></svg><span>概览</span><em data-badge="overview"></em></button>
        <button class="nav-item" data-section="holdings"><svg class="icon"><use href="#i-wallet"/></svg><span>持仓</span><em data-badge="holdings"></em></button>
        <button class="nav-item" data-section="trades"><svg class="icon"><use href="#i-swap"/></svg><span>交易</span><em data-badge="trades"></em></button>
        <button class="nav-item" data-section="reviews"><svg class="icon"><use href="#i-book"/></svg><span>每日复盘</span><em data-badge="reviews"></em></button>
        <button class="nav-item" data-section="plans"><svg class="icon"><use href="#i-calendar"/></svg><span>定投计划</span><em data-badge="plans"></em></button>
        <button class="nav-item" data-section="data"><svg class="icon"><use href="#i-database"/></svg><span>数据与导出</span></button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-foot">
        <div class="record-mini">
          <div class="record-mini-head"><span>300 记录</span><strong><span data-count-300>0</span><small>/ 300</small></strong></div>
          <div class="bar"><i data-bar-300 style="width:0%"></i></div>
        </div>
        <div class="side-rule"></div>
        <div class="theme-block">
          <div class="theme-head"><span>纸色</span><b data-theme-name>暖米</b></div>
          <div class="theme-dots" data-theme-dots></div>
        </div>
        <div class="side-rule"></div>
        <div class="storage-line">
          <span class="dot"></span>
          <span data-storage-label>本机浏览器存储</span>
          <span data-save-time class="save-time"></span>
        </div>
        <div class="storage-line subtle">
          <svg class="icon tiny"><use href="#i-lock"/></svg>
          <span>数据不上云</span>
          <button class="icon-btn tiny" data-action="go-data" title="数据与导出" aria-label="数据与导出"><svg class="icon tiny"><use href="#i-folder"/></svg></button>
        </div>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input id="import-input" type="file" accept=".json,application/json" hidden>

  <script src="assets/app.js" defer></script>
</body>
</html>
