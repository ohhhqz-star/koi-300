name: Build releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version && uname -m

      - name: Build app and zip
        run: |
          chmod +x mac/build.sh
          ./mac/build.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            mac/dist/*.zip
            mac/dist/*.sha256

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: desktop/dist/*.exe

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write checksums
        run: |
          mkdir -p artifacts/release
          find artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp {} artifacts/release/ \;
          cd artifacts/release
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: 复盘 300 ${{ github.ref_name }}
          body: |
            复盘 300 · 本地优先的投资复盘。

            - macOS：`Fupan300-macOS-1.2.0-universal.zip`，通用二进制，支持 Apple Silicon 与 Intel。
            - Windows：`Fupan300-Setup-1.2.0.exe`，传统安装包，默认安装到当前用户目录。

            macOS 首次打开：右键 App → 打开；若仍被拦截，可在终端执行
            `xattr -dr com.apple.quarantine "/Applications/复盘 300.app"`。

            数据只保存在本机。详细说明见仓库 README 与 docs/DATA.md。
          files: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
