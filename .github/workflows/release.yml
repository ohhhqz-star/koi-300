name: Build releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version && uname -m

      - name: Build app and zip
        run: |
          chmod +x mac/build.sh
          ./mac/build.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            mac/dist/*.zip
            mac/dist/*.sha256

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: desktop/dist/*.exe

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write checksums
        run: |
          mkdir -p artifacts/release
          find artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp {} artifacts/release/ \;
          cd artifacts/release
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Koi 300 ${{ github.ref_name }}
          body: |
            Koi 300 (锦记) — a local-first investment review journal.
            Write 300 entries before you buy. Style isn't imagined. It's recorded.

            - macOS: `Koi300-macOS-${{ env.VERSION }}-universal.zip` — universal binary for Apple Silicon and Intel.
            - Windows: `Koi300-Setup-${{ env.VERSION }}.exe` — per-user NSIS installer, no admin rights needed.
            - `SHA256SUMS.txt` — checksums for both files.

            **Bilingual UI.** Both desktop apps ship with a Chinese and an English interface.
            On macOS, switch under Language in the sidebar (the menu bar follows on the next launch);
            on Windows, use the language link in the window. The web demo has two entry points:
            https://ohhhqz-star.github.io/koi-300/en/ and https://ohhhqz-star.github.io/koi-300/zh/.
            English and Chinese JSON import cleanly into either version.

            **中英双语界面。** 桌面端内置中文与英文，macOS 在侧边栏「语言」中切换，Windows 在窗口内切换；
            网页演示提供 `/en/` 与 `/zh/` 两个入口。中英文写出的 JSON 都可以互相导入。

            First launch on macOS: right-click the app → Open; if macOS still blocks it, run
            `xattr -dr com.apple.quarantine "/Applications/Koi 300.app"`.

            All data stays on your machine. See README.md / README.zh-CN.md and
            docs/DATA.md / docs/DATA.zh-CN.md for details.
          files: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
