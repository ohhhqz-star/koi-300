name: Deploy web demo

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "shell/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble bilingual site
        run: |
          mkdir -p _site/en _site/zh
          cp -R site/. _site/en/
          cp -R web/. _site/zh/
          cp shell/index.html _site/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
